  /api/v1/attendance/:
    get:
      operationId: v1_attendance_list
      description: |-
        Shared base for anything hanging off a session.

        Admins can access all sessions.
        Teachers can only access sessions they own.
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
