  /api/v1/users/create/:
    post:
      operationId: v1_users_create_create
      description: |-
        POST /api/users/create/  (Admin only)

        Creates a Supabase Auth account and the matching AppUser profile row.
        Admin-only creation is the whole point — there is no open signup path
        anywhere in this API.

        Two ways to hand the new user their credentials:

        1. Default (no "password" in the body): Supabase sends the new user
           an invite email with a link to set their own password. Nobody —
           including the admin — ever knows or handles that password.

        2. Fallback (admin supplies "password" in the body): used when email
           delivery isn't set up/reliable yet. The admin sets it directly and
           relays it to the user out of band; the user should change it after
           first login.
      tags:
      - v1
      responses:
        '200':
          description: No response body
components:
  schemas:
    Attendance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        reason:
          type: string
          nullable: true
        session:
          type: string
          format: uuid
        student:
          type: string
          readOnly: true
      required:
      - session
      - student
    AttendanceStatusEnum:
      enum:
      - Present
      - Absent
      - Late
      - Excused
      - Not_Signed
      type: string
      description: |-
        * `Present` - Present
        * `Absent` - Absent
        * `Late` - Late
        * `Excused` - Excused
        * `Not_Signed` - Not_Signed
    BathroomLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
          readOnly: true
        duration:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: minutes; null while still out
        session:
          type: string
          format: uuid
        student:
          type: string
          format: uuid
        set_by:
          type: string
          format: uuid
      required:
      - duration
      - session
      - set_by
      - started_at
      - student
    Behavior:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeEnum'
        tag:
          type: string
          maxLength: 100
        point:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - tag
      - type
    EventLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        session:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        teacher_grade:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        triggered_by:
          type: string
          format: uuid
          readOnly: true
        metadata:
          readOnly: true
          nullable: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - event_type
      - id
      - metadata
      - occurred_at
      - session
      - teacher_grade
      - triggered_by
    EventTypeEnum:
      enum:
      - session_set
      - session_started
      - session_ended
      - grade_assigned
      type: string
      description: |-
        * `session_set` - session_set
        * `session_started` - session_started
        * `session_ended` - session_ended
        * `grade_assigned` - grade_assigned
    Grade:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          readOnly: true
        level:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        section:
          $ref: '#/components/schemas/SectionEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - label
      - level
      - section
    PatchedAttendance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        reason:
          type: string
          nullable: true
        session:
          type: string
          format: uuid
        student:
          type: string
          readOnly: true
    PatchedBehavior:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeEnum'
        tag:
          type: string
          maxLength: 100
        point:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
    PatchedGrade:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          readOnly: true
        level:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        section:
          $ref: '#/components/schemas/SectionEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 256
        status:
          allOf:
          - $ref: '#/components/schemas/SessionStatusEnum'
          readOnly: true
        start_at:
          type: string
          format: date-time
        duration:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: minutes
        created_at:
          type: string
          format: date-time
          readOnly: true
        creator:
          type: string
          format: uuid
          readOnly: true
        teacher:
          type: string
          format: uuid
        grade:
          type: string
          format: uuid
        subject:
          type: string
          format: uuid
          nullable: true
    PatchedSessionStudentBehavior:
      type: object
      properties:
        id:
          type: string
          format: uuid
        comment:
          type: string
          nullable: true
        consequence:
          type: string
