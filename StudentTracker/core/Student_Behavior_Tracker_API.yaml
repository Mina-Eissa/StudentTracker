  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        POST /api/auth/logout/  (private)

        Logs out the user by revoking the refresh token in Supabase Auth.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: GET /api/users/me/ — returns the profile of whoever the Bearer
        token belongs to.
      tags:
      - v1
      responses:
        '200':
          description: No response body
  /api/v1/auth/signin/:
    post:
      operationId: v1_auth_signin_create
      description: |-
        POST /api/auth/signin/  (public)
        Body: { email, password }

        Signs in against Supabase Auth on the frontend's behalf and returns the
        access token plus the caller's own profile in one response.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
